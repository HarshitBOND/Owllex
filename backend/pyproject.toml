[project]
name = "ravenslaw-backend"
version = "1.0.0"
description = "Ravenslaw Delhi High Court Cause List Parser API"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.135.*",
    "starlette==1.*",
    "uvicorn[standard]==0.34.*",
    "pdfplumber==0.11.*",
    "pydantic==2.*",
    "python-multipart==0.0.*",
    "pymongo==4.10.*",
    "requests>=2.31",
    "apscheduler>=3.10",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "pyjwt[crypto]>=2.9",
    "gunicorn==23.*",
    "playwright>=1.62.0",
]

# Ingestion/RAG deliberately NOT in the base dependency set: this stack is
# multi-GB (torch, Docling models, the embedding model's runtime), and the API
# image has no reason to carry it.
#
#   uv sync --extra rag        # storage + parsing + retrieval, no local model
#   uv sync --extra embeddings # adds torch + sentence-transformers
#
# The split is deliberate: a host that only parses and stores documents does not
# need a 4GB torch install, and the embedding model is the single largest thing
# in this dependency tree.
[project.optional-dependencies]
rag = [
    # ─── Storage ──────────────────────────────────────────────────────────────
    # Vector index. Replaces Chroma Cloud; persisted under FAISS_ROOT.
    "faiss-cpu>=1.8",
    # O(1) content-hash dedup index -- see rag/core/hash_index.py.
    "lmdb>=1.4",
    # chunk_text compression, PRODUCTION_TODO.md T16 -- rag/core/sqlite_store.py.
    "zstandard>=0.22",
    # numpy is FAISS's array interface and the embedder's output type. Pinned
    # below 3 only because faiss-cpu wheels are built against the 2.x ABI.
    "numpy>=1.26,<3",

    # ─── Parsing ──────────────────────────────────────────────────────────────
    # Layout analysis, table-structure recovery and OCR in one pass, emitting
    # Markdown with real page boundaries (rag/app/ingest/loader.py).
    "docling>=2.55",
    # Fallback parser: PDF text-layer extraction plus page rasterization.
    "pypdfium2>=5.13",
    # OCR for the fallback path. ONNX-only -- no torch.
    "rapidocr>=3.9",
    "onnxruntime>=1.20",
    # EXIF auto-orientation for photo uploads.
    "pillow>=12.0",

    # ─── Chunking ─────────────────────────────────────────────────────────────
    # Recursive character splitting with start-index metadata, which is what
    # maps each chunk back to the page it came from.
    "langchain-text-splitters>=0.3",
]

# The local embedding model. Split out because it is by far the heaviest part of
# the install and because a parse-only or retrieval-only host does not need it.
embeddings = [
    "sentence-transformers>=3.3",
    "torch>=2.5",
    "transformers>=4.51",
]

# Optional metadata refinement through a hosted LLM, for prose documents where
# the deterministic front-matter parse comes back empty. Off unless
# METADATA_LLM_ENABLED=true; install this extra only if you turn it on. A
# default deployment makes no outbound API calls at all.
metadata-llm = [
    "langchain-openai>=1.6.0",
]

[tool.uv]
package = false
