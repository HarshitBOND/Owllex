[project]
name = "ravenslaw-backend"
version = "1.0.0"
description = "Ravenslaw Delhi High Court Cause List Parser API"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.135.*",
    "starlette==1.*",
    "uvicorn[standard]==0.34.*",
    "pdfplumber==0.11.*",
    "pydantic==2.*",
    "python-multipart==0.0.*",
    "pymongo==4.10.*",
    "requests>=2.31",
    "apscheduler>=3.10",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "pyjwt[crypto]>=2.9",
    "gunicorn==23.*",
    "playwright>=1.62.0",
    "langchain-experimental>=0.4.2",
    "langchain-openai>=1.6.0",
]

# Ingestion/RAG only deliberately NOT in the base dependency set: this extract/OCR
# stack is still multi-hundred-MB (mostly onnxruntime), and the API image has no
# reason to carry it. uv sync --extra rag
[project.optional-dependencies]
rag = [
    "boto3>=1.35",
    # O(1) content-hash dedup index see rag/hash_db.py.
    "lmdb>=1.4",
    # Text/layout detection + recognition for scanned pages and photos (rag/app/ingest/loader.py).
    # ONNX-only -- no torch. Used directly, not through Docling: a full
    # document-understanding pipeline (layout model + table-structure model +
    # torch itself) cost ~1.2-1.4GB peak RSS just to OCR one short document,
    # which OOM-killed this process on anything under a 4GB instance. Plain
    # OCR does not reconstruct tables or heading structure -- load_text's
    # caller re-flows the text through its own markdown/HTML pipeline anyway,
    # so that trade buys running comfortably on a small instance instead.
    "rapidocr>=3.9",
    "onnxruntime>=1.20",
    # PDF text-layer extraction and page rasterization for the OCR fallback path.
    "pypdfium2>=5.13",
    # EXIF auto-orientation for photo uploads.
    "pillow>=12.0",
    "langchain-text-splitters>=0.3",
    # Token-length function for the splitter (chunk_size/overlap are measured in tokens, not chars).
    "tiktoken>=0.8",
    "langchain-chroma>=1.1.0",
]

[tool.uv]
package = false
