[project]
name = "ravenslaw-backend"
version = "1.0.0"
description = "Ravenslaw Delhi High Court Cause List Parser API"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.135.*",
    "starlette==1.*",
    "uvicorn[standard]==0.34.*",
    "pdfplumber==0.11.*",
    "pydantic==2.*",
    "python-multipart==0.0.*",
    "pymongo==4.10.*",
    "requests>=2.31",
    "apscheduler>=3.10",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "pyjwt[crypto]>=2.9",
    "gunicorn==23.*",
    "playwright>=1.62.0",
    "langchain-experimental>=0.4.2",
    "langchain-openai>=1.6.0",
    "docling>=2.123.0",
]

# Ingestion/RAG only deliberately NOT in the base dependency set. Docling
# pulls in torch and OCR models (multi-GB); the API image must not carry them.
#   uv sync --extra rag
[project.optional-dependencies]
rag = [
    "boto3>=1.35",
    "docling>=2.0",
    # O(1) content-hash dedup index see rag/hash_db.py.
    "lmdb>=1.4",
    # Docling's layout model runs on this instead of torch see rag/extract.py.
    "onnxruntime>=1.20",
    "langchain-text-splitters>=0.3",
    # Token-length function for the splitter (chunk_size/overlap are measured in tokens, not chars).
    "tiktoken>=0.8",
    "langchain-chroma>=1.1.0",
    # Declared explicitly, though Docling would pull them in anyway: a
    # [tool.uv.sources] pin only applies to direct dependencies, and without it
    # these resolve to the CUDA build (see the pytorch-cpu index below).
    "torch",
    "torchvision",
]

[tool.uv]
package = false

# Docling depends on torch, and the default PyPI torch wheel drags in ~43 NVIDIA
# CUDA packages (several GB) for GPU support this app never uses -- see the note
# above: the layout model runs on onnxruntime, and the containers are CPU-only.
# Pinning torch to PyTorch's CPU index drops all of them.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
