# Owllex reverse proxy.
#
#   Internet ──HTTPS──> nginx ──HTTP──> 127.0.0.1:8000 (gunicorn/FastAPI)
#
# Install:
#   sudo cp deploy/nginx/owllex.conf /etc/nginx/sites-available/owllex
#   sudo ln -sf /etc/nginx/sites-available/owllex /etc/nginx/sites-enabled/owllex
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then issue the certificate (this file is written to be certbot-ready; certbot
# rewrites the listen directives and fills in the ssl_certificate paths):
#   sudo certbot --nginx -d api.owllex.example
#
# Replace api.owllex.example throughout. deploy.sh does that substitution for
# you from $OWLLEX_DOMAIN.

# Rate limiting is defined at http scope, so these two lines belong in
# /etc/nginx/nginx.conf (inside the http block), not here. deploy.sh installs
# them as /etc/nginx/conf.d/owllex-limits.conf:
#
#   limit_req_zone $binary_remote_addr zone=owllex_api:10m rate=20r/s;
#   limit_conn_zone $binary_remote_addr zone=owllex_conn:10m;

upstream owllex_backend {
    server 127.0.0.1:8000 fail_timeout=0s;
    # The app is single-worker and long-lived; keeping connections open avoids a
    # TCP handshake per request from the Worker.
    keepalive 32;
}

# ── HTTP: redirect everything except the ACME challenge ─────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.owllex.example;

    # Certbot writes its challenge here. It must stay reachable over plain HTTP
    # or renewal fails silently and the certificate expires 90 days later.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.owllex.example;

    # Bootstrap certificate, generated by deploy.sh. `certbot --nginx` rewrites
    # these two lines to point at /etc/letsencrypt/live/… once it issues the real
    # one; nothing else here needs to change.
    #
    # These cannot simply be omitted until certbot runs: nginx refuses to load a
    # `listen 443 ssl` server with no certificate, which would take the whole
    # vhost down -- including the port-80 ACME challenge location certbot needs
    # to issue the certificate in the first place. A self-signed placeholder is
    # what breaks that deadlock.
    ssl_certificate     /etc/ssl/owllex/bootstrap.crt;
    ssl_certificate_key /etc/ssl/owllex/bootstrap.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/owllex/nginx/access.log;
    error_log  /var/log/owllex/nginx/error.log warn;

    # ── Security headers ────────────────────────────────────────────────────
    # `always` matters: without it these are dropped on 4xx/5xx responses, which
    # are exactly the ones an attacker is most likely to be looking at. HSTS is
    # only meaningful once the certificate is live -- do not enable it before,
    # or browsers will pin an origin that cannot serve HTTPS yet.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # This is an API: never let a browser guess that a response is HTML.
    server_tokens off;

    # ── The volume is never served from here ────────────────────────────────
    # nginx has no root inside /data and no location that could acquire one, so
    # there is no request that reaches a stored document except by proxying to
    # the backend, which checks ownership first. These three lines exist so that
    # stays true after somebody adds a location block in a hurry:
    #
    #   autoindex off  -- a location that ever gains a filesystem root must not
    #                     answer with a browsable listing of it. This is nginx's
    #                     default; stating it means a copy-pasted `autoindex on`
    #                     has to be a deliberate edit rather than an inherited one.
    #   root /dev/null -- any location that forgets to proxy_pass resolves under
    #                     a path that cannot contain a document, so the failure
    #                     mode is 404, not "serves /data".
    autoindex off;
    root /dev/null;

    # Belt and braces: even if a root were introduced above, these paths are
    # refused outright. /data is the mount point and /opt/owllex is the checkout;
    # neither has any business being addressable over HTTP.
    location ^~ /data { deny all; }
    location ^~ /opt  { deny all; }

    # Dotfiles, editor backups and version-control directories, which is what an
    # accidentally-rooted location leaks first.
    location ~ /\. { deny all; }
    location ~ ~$   { deny all; }

    # ── Uploads ─────────────────────────────────────────────────────────────
    # Court judgments run large, and the admin bulk import posts multi-file
    # batches. nginx's 1MB default rejects those with a 413 before the app ever
    # sees them. Keep this at or above RAVENSLAW_MAX_PDF_SIZE_MB * batch size.
    client_max_body_size 512M;
    client_body_buffer_size 1M;
    # Slow uploads from a courtroom connection are normal, not an attack.
    client_body_timeout 300s;
    client_header_timeout 60s;

    # ── Compression ─────────────────────────────────────────────────────────
    # JSON search responses carrying chunk text compress by ~80%. PDFs are
    # deliberately absent from this list: they are already compressed, so gzip
    # burns CPU to add bytes.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        application/json
        application/javascript
        application/xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # ── Proxy defaults ──────────────────────────────────────────────────────
    location / {
        limit_req zone=owllex_api burst=40 nodelay;
        limit_conn owllex_conn 20;

        proxy_pass http://owllex_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        # An OCR extraction or an embedding pass can hold a request open for
        # minutes. The 60s default turns those into a 504 for a request the
        # backend goes on to complete successfully -- the user retries, and now
        # two extractions are running.
        proxy_connect_timeout 15s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 64k;
    }

    # ── PDF streaming ───────────────────────────────────────────────────────
    # Buffering off, so a 200MB judgment starts reaching the browser immediately
    # instead of being spooled to nginx's disk first. That is the difference
    # between a viewer that renders page 1 in a second and one that appears
    # frozen for thirty. `max_temp_file_size 0` makes it an error rather than a
    # silent fallback to disk buffering.
    # Matches /api/v1/rag/documents/, /api/v1/rag/objects/, /api/user-documents/
    # and /api/documents/ -- every route that streams a stored file.
    location ~ ^/(api/v1/rag/(documents|objects)|api/user-documents|api/documents)(/|$) {
        proxy_pass http://owllex_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Range requests are what let a PDF viewer jump to page 400 without
        # downloading the first 399.
        proxy_force_ranges on;
        add_header Accept-Ranges bytes always;

        gzip off;
    }

    # ── Health ──────────────────────────────────────────────────────────────
    # Liveness stays public: the Cloudflare Worker and the frontend both probe
    # it, and it reveals nothing but a version string.
    location = /health {
        proxy_pass http://owllex_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    # The deep checks report paths, disk usage and corpus counts. That is
    # reconnaissance, not secret data, but there is no reason to publish it:
    # restrict to the host and your monitoring. Add your monitor's IP here.
    location /health/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://owllex_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    # Interactive docs are already disabled unless RAVENSLAW_DEBUG=true. Belt
    # and braces, since a debug flag left on in production is a common accident.
    location ~ ^/(docs|redoc|openapi\.json)$ {
        deny all;
    }
}
