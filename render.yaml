# Render Blueprint for the Ravenslaw Python backend (OCR + RAG + scraper).
#
# This is deliberately its own service, separate from the Vercel-hosted Next.js
# app: Vercel's serverless functions can't run Ghostscript, and this service's
# job is exactly what a serverless function is the wrong shape for (see
# backend/Dockerfile and app/api/lib/contractExtract.ts). Vercel only ever
# calls this over HTTPS.
#
# Deploy: Render dashboard -> New -> Blueprint -> point at this repo. Render
# reads this file and creates the service below; you then fill in the env vars
# marked `sync: false` from your local backend/.env (Render prompts for each
# one in its dashboard -- nothing secret is committed here).
#
# Sizing: extraction used to run on Docling (a document-layout model + a
# table-structure model + torch), which peaked at 1.2-1.4GB RSS on even a
# short document and needed a 4GB instance. rag/app/ingest/loader.py now uses
# pypdfium2 for the text layer and a bare RapidOCR pass only for pages that
# actually need it -- measured worst case (a 15-page fully-scanned PDF, every
# page OCR'd) peaks at ~880MB. 1c-2g (2GB) covers that with real headroom;
# `free` (512MB) covers ordinary digital PDFs (the common case, near-zero
# memory) but is not safe for a long fully-scanned upload -- go to 1c-2g
# unless you're certain nobody will ever upload a multi-page scan.
services:
  - type: web
    name: ravenslaw-backend
    runtime: docker
    # dockerfilePath and dockerContext are relative to the repo root, not to
    # any rootDir -- Render's own docs are explicit about this and it is easy
    # to get backwards in a monorepo.
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: 1c-2g
    region: singapore
    healthCheckPath: /health
    numInstances: 1
    envVars:
      # Non-secret defaults -- safe to commit.
      - key: RAVENSLAW_DEBUG
        value: "false"
      - key: RAVENSLAW_WARM_DOCUMENT_CONVERTER
        value: "true"
      - key: ENABLE_SCRAPER_SCHEDULER
        value: "false"
      - key: PDF_DOWNLOAD_ENABLED
        value: "false"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: WEB_TIMEOUT
        value: "300"
      # RAVENSLAW_TRUSTED_HOSTS defaults to include *.onrender.com already
      # (see backend/README.md) -- only override if you're on a custom domain.

      # Secrets and per-environment values -- fill in via the Render dashboard,
      # copying from your local backend/.env. Nothing here is written to git.
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        sync: false
      - key: RAVENSLAW_INTERNAL_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CHROMA_API_KEY
        sync: false
      - key: CHROMA_TENANT
        sync: false
      - key: CHROMA_DATABASE
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_DOCS_BASE_URL
        sync: false
      - key: CLERK_JWT_ISSUER
        sync: false
      # Must be the exact Vercel production domain(s), comma-separated,
      # HTTPS only -- the backend refuses to boot without this in production.
      - key: RAVENSLAW_CORS_ORIGINS
        sync: false
